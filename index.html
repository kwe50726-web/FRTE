<script>
var T=null;try{T=localStorage.getItem("rwbT")}catch(e){}
var CID=Math.random().toString(36).slice(2,10);
const _post=(p,b)=>fetch(p,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+(T||"")},body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>({}));
function _room(name){const subs=new Set(),pres={};let peers=[];const es=new EventSource("/api/events?room="+encodeURIComponent(name)+"&cid="+CID+"&t="+encodeURIComponent(T||""));
 es.onmessage=e=>{try{peers=JSON.parse(e.data)}catch(x){return}subs.forEach(f=>{try{f()}catch(x){}})};
 return{peers:()=>peers.map(p=>({peer:p.peer,kind:"viewer",isMe:p.peer===CID,presence:p.presence||{}})),
  presence(d){Object.assign(pres,d);_post("/api/presence",{room:name,cid:CID,data:d})},
  onPeers(f){subs.add(f);return()=>subs.delete(f)},
  async leave(){es.close();subs.clear();_post("/api/leave",{room:name,cid:CID})}}}
window.claude={async use(c){
 if(c=="room"){const r=_room("lobby");r.join=async n=>_room(n);return r}
 if(c=="user")return{id:async()=>S.acct?S.acct.id:null,me:async()=>({email:S.acct&&S.acct.email})};
 if(c=="db")return{collection:()=>({limit:()=>({onSnapshot(cb){const f=async()=>{const a=await fetch("/api/players").then(r=>r.json()).catch(()=>null);if(a)cb({docs:a.map(x=>({id:x.id,data:()=>x}))})};f();setInterval(f,5000)}})}),doc:()=>({set:async d=>{await _post("/api/player",d)}})};
 return null}};
</script>

function tick(){const g=L&&L.g;if(!g||g.st!="play")return;const f=$("#fz");if(f)f.style.width=Math.max(0,Math.min(1,(L.dl-Date.now())/g.d))*100+"%"}
function paint(force){if(!L)return;const g=L.g,op=opInfo(),me={n:S.name,e:S.elo,c:S.skin};
 const st=$("#start");if(st){const o0=g&&g.st=="over",busy=g&&g.st=="play",inRoom=!!L.nr&&!L.q;st.disabled=!!(busy||(inRoom&&!o0)||(L.q&&op&&!o0));$("#stl").textContent=L.q?"Annuler":"Prêt"}
 const key=JSON.stringify([g&&g.q,op&&op.n,op&&op.e,L.msg,L.hide,L.pub,L.res&&L.res.id,!!L.flash,L.role,S.skin,S.name]);
 if(key===L.key&&!force)return;L.key=key;
 const host=L.role=="h"?me:op,guest=L.role=="h"?op:me,play=g&&g.st=="play",over=g&&g.st=="over";
 const lives=s=>{if(!g)return"";const lost=g.sc[s=="h"?1:0];return Array.from({length:3},(_,i)=>`<svg width="16" height="16" style="--bc:${i<3-lost?"#ddd":"#333"}"><use href="#bomb"/></svg>`).join("")};
 const pv=(p,s)=>!p?`<div class="pv"><div class="cr">&nbsp;</div><div class="slot ${L.msg&&!L.noRoom?"pulse":""}">${ic("users",44)}</div><div class="pn">&nbsp;</div></div>`:
  `<div class="pv ${play&&g.t==s?"act":""}"><div class="cr">${s=="h"?"👑 ":""}${p.e}</div><div class="avc">${medal(p.c,74)}</div><div class="pn">${esc(p.n)}${p===me?" (you)":""}</div><div class="lvs">${lives(s)}</div></div>`;
 let c;
 if(play)c=`<div class="ctr"><div class="m2">Round ${g.rd}</div><svg id="bb" width="110" height="110" class="${L.flash?"bm":""}"><use href="#bomb"/></svg><div class="sy">${g.syl}</div><div class="fz"><div id="fz"></div></div><div class="m2">${g.t==L.role?"Your turn!":esc(op.n)+" is thinking…"}</div><input class="gi2" id="in" autocomplete="off" autocapitalize="off" placeholder="Type a word…" ${g.t==L.role?"":"disabled"}><div class="m2" id="msg">${L.flash?"💥 Boom!":""}</div></div>`;
 else if(over){const r=L.res;c=`<div class="ctr"><div style="font-size:30px;font-weight:900">${r&&r.win?"Victory!":"Defeat"}</div><div style="font-size:20px;font-weight:800">${r?r.sc[0]+" – "+r.sc[1]:""}</div><div style="font-size:24px;font-weight:900;color:#ffd23a">${r&&r.mode=="ranked"?(r.d>=0?"+":"")+r.d+" Elo":"Unranked"}</div><p><button class="lk2" onclick="seeRep()">Watch replay</button></p><div class="m2">Press Prêt to find a new match</div></div>`}
 else c=`<div class="ctr"><div class="cl">CODE DE LA SALLE</div>`+(L.bot?`<div class="dts">Match vs ${esc(L.bot[0])}</div>`:`<div class="dts" onclick="L.hide=!L.hide;paint()" title="Show / hide">${ic("eye",16)} ${L.hide?"••••":L.code}</div><div class="cl" style="margin-top:14px">PUBLIC ROOM <span class="tg ${L.pub?"on":""}" onclick="togglePub()"><i></i></span></div>`)+(L.msg?`<div class="srch">${esc(L.msg)}${L.msg.startsWith("Searching")?'<span class="dd"></span>':""}</div>`:"")+""+`</div>`;
 $("#arena").innerHTML=pv(guest,"g")+c+pv(host,"h");
 const i=$("#in");if(i&&!i.disabled){i.focus();i.onkeydown=e=>{if(e.key=="Enter")submit(i.value)}}}
function togglePub(){if(L.role!="h"||!L.main)return;L.pub=!L.pub;rm.presence({pub:L.pub&&!L.opp?L.code:null});paint()}
function botMatch(){const mt=L.mt=="ranked"?"ranked":"practice",o=pickBot();closeLobby();openLobby("bot",{opp:o,mt})}
function seeRep(){const id=L.res&&L.res.id;closeLobby();tab="rep";render();id&&openRep(id)}
function chatSend(){const i=$("#ci"),t=i.value.trim().slice(0,120);if(!t)return;i.value="";L.cid=(L.cid||0)+1;addChat(S.name,t);if(L.nr)L.nr.presence({ch:{i:Date.now()%1e9+"-"+L.cid,t}})}
function addChat(n,t){L.chat.push({n,t});L.chat=L.chat.slice(-30);const b=$("#cl");if(b){b.innerHTML=L.chat.map(c=>`<div><b>${esc(c.n)}:</b> ${esc(c.t)}</div>`).join("");b.scrollTop=9e9}}
function chatSync(){const o=L.opp,c=o&&o.presence.ch;if(c&&c.i!=L.lci){L.lci=c.i;addChat(String(o.presence.n||"Opponent").slice(0,16),String(c.t||"").slice(0,120))}}
function closeLobby(){if(!L)return;clearTimeout(L.tm);clearTimeout(L.bt);clearInterval(L.tk);L.un.forEach(f=>{try{f()}catch(e){}});try{L.nr&&L.nr.leave()}catch(e){}try{rm&&rm.presence({pub:null,looking:null})}catch(e){}const o=$("#lob");if(o)o.remove();L=null}
function quit(){closeLobby();if(tab=="play")tab="lb";render()}

/* LEADERBOARD */
let PL=[],db=null,uid=null;
async function initDb(){try{const u=await claude.use("user");db=await claude.use("db");if(!db||!u){render();return}uid=await u.id();db.collection("players").limit(200).onSnapshot(s=>{PL=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(tab=="lb")vLb()},()=>{});if(S.played>0)pushMe()}catch(e){}}
function pushMe(){if(!db||!uid)return;db.doc("players/"+uid).set({n:S.name,e:S.elo,w:S.w,l:S.l,p:S.played}).catch(()=>{})}
function vLb(){const q=lq.toLowerCase(),a=PL.filter(x=>x.p>=1).map(x=>({pl:x.p>=5,n:String(x.n||"Player").slice(0,16),e:+x.e||0,w:+x.w||0,l:+x.l||0,me:x.id==uid})).sort((x,y)=>y.e-x.e);a.forEach((x,i)=>x.pos=i+1);const r=rk();
 $("#v").innerHTML=`<div class="pg"><div class="hdr"><div><h2>Leaderboard</h2><div class="sub">Real players only · ${a.length} players</div></div><button class="wb" onclick="vLb()">${ic("refresh",16)} Refresh</button></div>
 <div style="background:var(--soft);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:12px 26px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700">${badge(RK.indexOf(r),26)}${esc(S.name)}<span style="margin-left:auto">${r[0]}</span><span class="m" style="margin-left:14px">${placed()?S.elo+" Elo":Math.min(S.played,5)+" / 5 placements"}</span></div>
 <div class="bd"><div class="fr"><input class="in" id="lq" placeholder="Search players" value="${esc(lq)}"><button class="wb" onclick="lq=$('#lq').value;vLb()">Search</button></div>
 <div class="tb"><div class="tr th"><span>#</span><span>Player</span><span>Rank</span><span>Elo</span><span>W / L</span></div>${a.filter(x=>x.n.toLowerCase().includes(q)).map(x=>{const k=rk(x.e,x.pl);return`<div class="tr ${x.me?"me":""}"><span>${x.pos}</span><span>${esc(x.n)}${x.pos==1?" 🏆":""}</span><span class="rk">${badge(RK.indexOf(k),30)}${k[0]}</span><span>${x.e}</span><span>${x.w} / ${x.l}</span></div>`}).join("")||`<div class="tr m" style="display:block;padding:20px">${db?"No players yet. Play a ranked match to appear here.":"The shared leaderboard needs this page open in claude.ai while signed in."}</div>`}</div></div></div>`}
/* REPLAYS */
function vRep(){$("#v").innerHTML=`<div class="pg"><div class="hdr"><div><h2>Match history</h2><div class="sub">Review each round, words and results.</div></div></div>
 <div class="bd"><b style="color:#1a7fb0;font-size:13px">Find a replay</b><div class="fr"><input class="in" id="rid" placeholder="Paste a replay ID"><button class="wb" onclick="openRep($('#rid').value.trim())">Watch replay</button></div></div>
 <div>${S.hist.length?S.hist.map(h=>`<div class="rp"><span class="wl ${h.win?"w":"l"}">${h.win?"W":"L"}</span><div style="flex:1"><b>vs. ${esc(h.opp)}</b><div class="m">${h.date} · ${h.mode=="ranked"?"Ranked 1v1":h.mode=="friend"?"Friend challenge":"Practice"} · ${h.id}</div></div><div class="rs"><b>${h.sc[0]}–${h.sc[1]}</b> <small>rounds</small><div class="m">${h.words} words · Final round</div></div><b class="${h.win&&h.mode=="ranked"?"g":""}" style="min-width:80px;text-align:right">${h.mode=="ranked"?(h.pl?"Placement":(h.d>=0?"+":"")+h.d+" Elo"):"Unranked"}</b><button class="ic" onclick="openRep('${h.id}')">${ic("tri",18)}</button></div>`).join(""):`<div class="rp m">No matches yet.</div>`}</div></div><div id="rd"></div>`}
function openRep(id){if(tab!="rep"){tab="rep";render()}const h=S.hist.find(x=>x.id==id),o=$("#rd");if(!h){o.innerHTML=`<div class="pg"><div class="bd">Replay not found.</div></div>`;return}
 o.innerHTML=`<div class="pg"><h2 style="margin:0;padding:22px 26px 6px">Replay vs. ${esc(h.opp)} · ${h.sc[0]}–${h.sc[1]}</h2><div class="bd">${h.log.map(l=>`<div style="padding:5px 0;font-weight:700">${l.w=="me"?esc(S.name):esc(h.opp)} · <span style="color:#119bda">${l.s.toUpperCase()}</span> → ${l.boom?`<span style="color:#d6334a">💥 exploded</span>`:`<span class="g">${l.word}</span>`}</div>`).join("")}</div></div>`;o.scrollIntoView({behavior:"smooth"})}
/* RANKS */
function vRanks(){$("#v").innerHTML=`<div class="pg"><h2>Ranks</h2><div class="bd"><div class="rg">${RK.map((r,i)=>`<div class="rc">${badge(i,r[0].startsWith("Grand")?100:88)}<b>${r[0]}</b><span class="m">${r[1]}</span></div>`).join("")}</div></div>
 <div class="info"><div><h4>Five matches to find your level</h4><p>Your rating adjusts from your first match but your rank stays Unranked until you finish five valid matches. Practice and friend matches don’t count.</p></div><div><h4>A fair correction</h4><p>Wins and losses count; cancelled matches don’t. Ratings are recalculated in match order.</p></div><div><h4>Your opponent matters</h4><p>Beating a higher-rated bomber is worth more. Calibration adjusts your own rating faster during placements.</p></div></div></div>`}
/* SKINS RULES SUPPORT SETTINGS */
function vSkins(){const K=[["Classic","#222"],["Fire","#e8541c"],["Ice","#36c6ff"],["Gold","#f5b400"],["Toxic","#3ecf5a"],["Berry","#b03bd6"]];
 $("#v").innerHTML=`<div class="pg"><h2>Skins</h2><div class="bd"><div class="sk">${K.map(k=>`<button class="${S.skin==k[1]?"on":""}" onclick="S.skin='${k[1]}';save();theme();vSkins()">${medal(k[1],70)}<div>${k[0]}</div></button>`).join("")}</div></div></div>`}
function vRules(){$("#v").innerHTML=`<div class="pg"><h2>Rules</h2><div class="bd"><h3 style="margin-top:0">How a round works</h3><p>A syllable appears on the bomb. Type a French word containing it before the fuse burns out. Then the bomb passes to your opponent with a new syllable. Whoever holds the bomb when it explodes loses the round.</p><h3>Match</h3><p>First to three rounds wins. A word can only be used once per match (3 letters minimum).</p><h3>Ranked</h3><p>Your first 5 ranked matches are placements. Then your Elo moves with every result. Practice and friend challenges are unranked.</p></div></div>`}
function vSup(){$("#v").innerHTML=`<div class="pg"><h2>Support</h2><div class="bd"><div style="text-align:center;padding:20px">${medal("#e8541c",90)}<h3>Thanks for playing!</h3><p class="m" style="font-size:14px">Ranked WordBomb is an unofficial community project. Opponents are simulated bots and data is saved only in your browser.</p></div></div></div>`}
async function boot(){theme();render();await auth();initDb();openLobby("idle")}
async function auth(){if(T){const r=await fetch("/api/me",{headers:{Authorization:"Bearer "+T}}).then(r=>r.ok?r.json():null).catch(()=>null);if(r){applyAcct(r);return}T=null;localStorage.removeItem("rwbT")}await authForm()}
function applyAcct(a){S.acct=a;S.name=a.n;if(S.accId!==a.id){Object.assign(S,{elo:1000,played:0,w:0,l:0,hist:[],accId:a.id});if(a.stats)Object.assign(S,{elo:a.stats.e,w:a.stats.w,l:a.stats.l,played:a.stats.p})}save()}
function authForm(){return new Promise(res=>{let mode="reg";const o=document.createElement("div");o.id="acct";document.body.appendChild(o);
 const draw=()=>{o.innerHTML=`<div class="ac"><svg width="84" height="84" style="--bc:#d6334a"><use href="#bomb"/></svg><h2 style="margin:6px 0">${mode=="reg"?"Create your account":"Log in"}</h2>${mode=="reg"?'<input class="in" id="au" maxlength="16" placeholder="Username" style="margin-top:8px">':""}<input class="in" id="ae" type="email" placeholder="Email" style="margin-top:10px"><input class="in" id="ap" type="password" placeholder="Password (6+ characters)" style="margin-top:10px"><div id="aerr" style="color:#d6334a;font-weight:700;font-size:13px;min-height:20px;margin:8px 0"></div><button class="bt y" id="ago" style="width:100%;justify-content:center">${mode=="reg"?"Create account":"Log in"}</button><p class="m" style="margin-top:12px;cursor:pointer;text-decoration:underline" id="asw">${mode=="reg"?"I already have an account":"Create a new account"}</p></div>`;
  $("#asw").onclick=()=>{mode=mode=="reg"?"log":"reg";draw()};
  $("#ago").onclick=async()=>{const er=$("#aerr"),b={email:$("#ae").value.trim(),pw:$("#ap").value};if(mode=="reg")b.n=$("#au").value.trim();
   const r=await fetch("/api/"+(mode=="reg"?"register":"login"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>({error:"Server unreachable"}));
   if(r.error){er.textContent=r.error;return}
   T=r.token;localStorage.setItem("rwbT",T);o.remove();applyAcct(r.acct);res()}};
 draw()})}
function vSet(){$("#v").innerHTML=`<div class="pg"><h2>Settings</h2><div class="bd"><p class="m">Signed in as ${esc(S.acct?S.acct.email:"")}</p><b style="color:#1a7fb0;font-size:13px">Username</b><div class="fr"><input class="in" id="nm" maxlength="16" value="${esc(S.name)}"><button class="wb y" onclick="S.name=$('#nm').value.trim()||'Player';save();pushMe();render()">Save</button></div><h3>Progress</h3><button class="wb" onclick="if(confirm('Reset everything?')){localStorage.removeItem('rwb2');location.reload()}">Reset progress</button> <button class="wb" onclick="localStorage.removeItem('rwbT');location.reload()">Log out</button></div></div>`}
/* FRIENDS */
function vFr(){$("#v").innerHTML=`<div class="pg"><h2>Friends</h2><div class="bd"><h3 style="margin-top:0">Play with a friend</h3><p>Create a private room and send the 4-letter code to your friend. They enter it in <b>Join room</b>. Friend matches are unranked and never change your Elo.</p><button class="wb y" onclick="openLobby('create')">${ic("play",16)} Create private room</button><p class="m" style="margin-top:14px">Your friend must have this page open in claude.ai while signed in.</p></div></div>`}
boot();
</script></body></html>
